name: Release Caller

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '*'

jobs:
  call-workflow:
    permissions:
      contents: write
    uses: ac-clash/workflows/.github/workflows/java-gradle-release.yml@main
    secrets:
      token: ${{ secrets.TOKEN }}
      passwd: ${{ secrets.PASSWD }}
