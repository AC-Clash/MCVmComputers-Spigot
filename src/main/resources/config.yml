# VM Computers

audio:
  # Guest audio cannot be played through Minecraft. Its sound packet carries a sound *name* and a
  # pitch -- there is no way to send samples, and a vanilla client can only play files it already
  # has. So the plugin serves the audio over HTTP instead, and a player opens it in a browser.
  # Nothing is streamed until someone asks for a link, and the guest's sound card is left idle
  # until the first listener connects.
  enabled: true

  # Port the audio server listens on. Players' browsers connect here, so it has to be open in the
  # firewall and forwarded the same way the Minecraft port is.
  port: 25566

  # What to put in the link handed to players. The server has no reliable way to discover how the
  # outside world reaches it, so set this to the domain or public IP people already use to connect.
  # Left blank, the plugin falls back to server-ip from server.properties, and then to localhost --
  # which only works if the player is on the same machine.
  public-address: ""

  # Samples per second. 44100 is CD rate and what most guests produce; QEMU refuses anything above
  # 48000. Lower costs less bandwidth and sounds worse.
  sample-rate: 44100

  # How much audio is held for listeners, in milliseconds. A browser that stalls is allowed to fall
  # this far behind before the oldest audio is dropped and it is snapped back to live. It is never
  # allowed to slow the connection down instead: that thread also paces the frame rate, so a stuck
  # listener must never cost anyone frames.
  buffer-millis: 2000

limits:
  # Most virtual machines allowed to run at once, across the whole server.
  #
  # Each running computer is a real QEMU process holding however much memory its RAM component
  # says, so ten players each booting a desktop is ten desktops' worth of RAM on this host. There
  # is no queue: once this many are running, the next power-on is refused with a message naming
  # the limit. Raise it if the host can take it.
  max-running: 4

  # Most one player may have running at a time. 0 disables the per-player limit and leaves only
  # the server-wide one above.
  #
  # This is the limit that stops one person occupying the whole allowance, which matters more than
  # the total on a busy server.
  max-per-player: 2

guest:
  # Whether guests get a network card at all.
  #
  # On is what makes network installs work -- a Debian netinst image is useless without it, and so
  # is anything a player wants to download inside the guest. It also means a player's virtual
  # machine can reach whatever this server can reach, which includes other machines on the host's
  # LAN and anything listening on localhost. That is user-mode NAT working as designed; there is no
  # setting that grants the internet while withholding the LAN.
  #
  # Turn it off on a public server unless you have a reason not to, and expect network installers
  # to stop working when you do.
  networking: true
